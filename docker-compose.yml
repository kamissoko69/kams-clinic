services:
  kams-clinic-db:
    image: postgres:15-alpine
    container_name: kams-clinic-db
    environment:
      POSTGRES_USER: kams_admin
      POSTGRES_PASSWORD: kams_secure_pass
      POSTGRES_DB: kams_clinic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  kams-clinic-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kams-clinic-backend
    environment:
      PORT: 5000
      DB_HOST: kams-clinic-db
      DB_USER: kams_admin
      DB_PASSWORD: kams_secure_pass
      DB_NAME: kams_clinic_db
      DB_PORT: 5432
    depends_on:
      - kams-clinic-db
    restart: always

  kams-clinic-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kams-clinic-frontend
    ports:
      - "80"
    restart: always

  kams-clinic-nginx:
    image: nginx:alpine
    container_name: kams-clinic-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kams-clinic-frontend
      - kams-clinic-backend
    restart: always

volumes:
  postgres_data:
version: '3.8'

networks:
  kams_clinic_network:
    driver: bridge

volumes:
  kams_clinic_db_data:

services:
  kams-clinic-db:
    image: postgres:15-alpine
    container_name: kams-clinic-db
    environment:
      POSTGRES_USER: kams_admin
      POSTGRES_PASSWORD: kams_secure_pass
      POSTGRES_DB: kams_clinic_db
    volumes:
      - kams_clinic_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kams_clinic_network
    restart: always

  kams-clinic-backend:
    build: ./backend
    container_name: kams-clinic-backend
    environment:
      DB_HOST: kams-clinic-db
      DB_USER: kams_admin
      DB_PASSWORD: kams_secure_pass
      DB_NAME: kams_clinic_db
      DB_PORT: 5432
      PORT: 5000
    depends_on:
      - kams-clinic-db
    networks:
      - kams_clinic_network
    restart: always

  kams-clinic-frontend:
    build: ./frontend
    container_name: kams-clinic-frontend
    networks:
      - kams_clinic_network
    restart: always

  kams-clinic-nginx:
    image: nginx:alpine
    container_name: kams-clinic-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kams-clinic-frontend
      - kams-clinic-backend
    networks:
      - kams_clinic_network
    restart: always